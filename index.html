<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRAXIS HG zoeker</title>
    <link rel="icon" href="praxis-academy.ico" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#ffcc00" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="search-panel" aria-labelledby="app-title">
        <div class="header">
          <img class="app-logo" src="logo-voor-app.png" alt="Praxis" />
          <div>
            <p class="eyebrow">Mobiele productzoeker</p>
            <h1 id="app-title">HG finder</h1>
          </div>
        </div>

        <label class="search-label" for="productSearch">Productnaam of Nummer</label>
        <div class="search-box">
          <input
            id="productSearch"
            type="text"
            inputmode="search"
            autocomplete="off"
            placeholder="Bijv. badkamer, ontkalker, voegen..."
          />
          <button id="clearSearch" type="button" aria-label="Zoekveld leegmaken">x</button>
        </div>

        <div id="result" class="result idle" aria-live="polite">
          <span class="result-label">Resultaat</span>
          <strong>Voer een product in</strong>
        </div>
      </section>

      <section class="list-panel" aria-labelledby="list-title">
        <div class="list-heading">
          <h2 id="list-title">Producten</h2>
          <span id="countLabel">0 gevonden</span>
        </div>
        <div id="productList" class="product-list"></div>
      </section>

      <footer class="app-footer">
        <a href="https://deheusden.nl" target="_blank" rel="noopener">© 2026 Perfect Picture Approved</a>
      </footer>
    </main>

    <script src="script.js?v=20260511"></script>
  </body>
</html>
